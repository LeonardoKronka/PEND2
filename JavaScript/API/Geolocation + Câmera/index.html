<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Funcionário</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Cadastro de Funcionário</h1>

        <p>
            Cadastre um funcionário para acesso às máquinas industriais.
        </p>

        <label>Nome:</label>
        <input type="text" id="nome">

        <label>Especialização:</label>

        <select id="especializacao">
            <option>Operador de Torno</option>
            <option>Operador de Fresadora</option>
            <option>Eletricista Industrial</option>
            <option>Mecânico Industrial</option>
        </select>


        <h2>Localização</h2>

        <p id="status-localizacao">
            Verificando localização...
        </p>


        <h2>Foto do Funcionário</h2>

        <video id="camera" autoplay></video>


        <br>

        <button>Cadastrar Funcionário</button>

    </div>


    <script src="script.js"></script>

</body>

</html>
